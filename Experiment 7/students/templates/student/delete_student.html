<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
</head>
<body>
    <h1>Delete Student</h1>
    <p>Are you sure you want to remove <strong>{{ student.first_name }} {{ student.last_name }}</strong> from the system?</p>
    
    <form method="POST">
        {% csrf_token %} <button type="submit" style="color: red;">Yes, Delete</button>
    </form>
    <br>
    <a href="{% url 'student_list' %}">Cancel</a>
</body>
</html>
